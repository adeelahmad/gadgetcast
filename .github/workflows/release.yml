name: Release

# Push a tag (git tag v0.1.0 && git push --tags) or click "Run workflow" in the
# Actions tab and type a version. Builds every Linux target, publishes the
# GitHub release that install.sh and the update timer pull from, then builds
# the flashable Raspberry Pi image and attaches it to the same release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. v0.1.0
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  binaries:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ]; then
            v="$INPUT_VERSION"
            echo "$v" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$' || { echo "::error::version must look like v1.2.3"; exit 1; }
            git tag "$v"
            git push origin "$v"
          else
            v="$GITHUB_REF_NAME"
          fi
          echo "version=$v" >>"$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build web UI
        run: |
          # The Studio UI is embedded into the binary (web/embed.go).
          if [ -f web/package.json ]; then
            cd web && npm ci && npm run build
          fi

      - name: Test
        run: go test ./...

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          [ -d cmd/gadgetcast ] || { echo "::error::cmd/gadgetcast does not exist yet; nothing to release"; exit 1; }
          mkdir -p dist
          for target in arm64 armv7 armv6 amd64; do
            case "$target" in
              arm64) goarch=arm64 goarm= ;;
              armv7) goarch=arm goarm=7 ;;
              armv6) goarch=arm goarm=6 ;;
              amd64) goarch=amd64 goarm= ;;
            esac
            out="dist/$target"
            mkdir -p "$out"
            CGO_ENABLED=0 GOOS=linux GOARCH="$goarch" GOARM="$goarm" \
              go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$out/gadgetcast" ./cmd/gadgetcast
            cp install.sh "$out/"
            tar -czf "dist/gadgetcast_linux_$target.tar.gz" -C "$out" gadgetcast install.sh
          done
          cp install.sh dist/install.sh
          (cd dist && sha256sum ./*.tar.gz install.sh | sed 's# \./# #' >SHA256SUMS && cat SHA256SUMS)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=
          case "$VERSION" in *-*) prerelease=--prerelease ;; esac
          gh release create "$VERSION" --verify-tag --generate-notes $prerelease \
            dist/*.tar.gz dist/install.sh dist/SHA256SUMS

  pi-image:
    needs: binaries
    uses: ./.github/workflows/pi-image.yml
    with:
      version: ${{ needs.binaries.outputs.version }}
