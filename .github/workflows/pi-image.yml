name: Pi image

# Builds a flashable Raspberry Pi OS Lite (64-bit) image with gadgetcast
# preinstalled, USB gadget mode enabled, hostname gadgetcast.local and
# automatic updates on, then attaches it to the release. Called by the release
# workflow; can also be run by hand for an existing release.
#
# The image keeps Raspberry Pi OS's cloud-init first boot, so Raspberry Pi
# Imager's OS customisation (hostname, user, Wi-Fi, SSH, locale) applies to it.
# gadgetcast-os-list.json is an Imager repository entry for the image that
# declares this (init_format cloudinit-rpi), so Imager offers customisation.

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag to build the image for, e.g. v0.1.0
        required: true

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Fetch release binary
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          files=image/stage-gadgetcast/00-install/files
          tmp="$(mktemp -d)"
          gh release download "$VERSION" -D "$tmp" -p gadgetcast_linux_arm64.tar.gz -p SHA256SUMS
          (cd "$tmp" && grep ' gadgetcast_linux_arm64.tar.gz$' SHA256SUMS | sha256sum -c -)
          tar -xzf "$tmp/gadgetcast_linux_arm64.tar.gz" -C "$files"
          echo "$VERSION" >"$files/VERSION"
          ls -l "$files"

      - uses: usimd/pi-gen-action@v1
        id: build
        with:
          image-name: gadgetcast-${{ inputs.version }}
          stage-list: stage0 stage1 stage2 ./image/stage-gadgetcast
          hostname: gadgetcast
          locale: en_US.UTF-8
          keyboard-keymap: us
          keyboard-layout: English (US)
          timezone: Etc/UTC
          compression: xz
          enable-cloud-init: 1
          increase-runner-disk-size: true

      - name: Attach image to release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          IMAGE: ${{ steps.build.outputs.image-path }}
          REPO: ${{ github.repository }}
        run: |
          sha256sum "$IMAGE" | sed 's#  .*/#  #' >"$IMAGE.sha256"
          name="$(basename "$IMAGE")"
          extract_size="$(xz -dc "$IMAGE" | wc -c)"
          extract_sha256="$(xz -dc "$IMAGE" | sha256sum | cut -d' ' -f1)"
          jq -n \
            --arg name "gadgetcast $VERSION" \
            --arg url "https://github.com/$REPO/releases/download/$VERSION/$name" \
            --arg date "$(date -u +%F)" \
            --argjson extract_size "$extract_size" \
            --arg extract_sha256 "$extract_sha256" \
            --argjson size "$(stat -c %s "$IMAGE")" \
            --arg sha256 "$(cut -d' ' -f1 "$IMAGE.sha256")" \
            '{os_list: [{
              name: $name,
              description: "Raspberry Pi OS Lite (64-bit) with gadgetcast: a USB webcam and audio device fed from browsers over WebRTC",
              url: $url,
              release_date: $date,
              extract_size: $extract_size,
              extract_sha256: $extract_sha256,
              image_download_size: $size,
              image_download_sha256: $sha256,
              init_format: "cloudinit-rpi",
              devices: ["pi5-64bit", "pi4-64bit", "pi3-64bit"]
            }]}' >gadgetcast-os-list.json
          cat gadgetcast-os-list.json
          gh release upload "$VERSION" "$IMAGE" "$IMAGE.sha256" gadgetcast-os-list.json --clobber
