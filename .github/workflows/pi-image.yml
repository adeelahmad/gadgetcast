name: Pi image

# Builds a flashable Raspberry Pi OS Lite (64-bit) image with gadgetcast
# preinstalled, USB gadget mode enabled, hostname gadgetcast.local and
# automatic updates on, then attaches it to the release. Called by the release
# workflow; can also be run by hand for an existing release.

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag to build the image for, e.g. v0.1.0
        required: true

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Fetch release binary
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          files=image/stage-gadgetcast/00-install/files
          tmp="$(mktemp -d)"
          gh release download "$VERSION" -D "$tmp" -p gadgetcast_linux_arm64.tar.gz -p SHA256SUMS
          (cd "$tmp" && grep ' gadgetcast_linux_arm64.tar.gz$' SHA256SUMS | sha256sum -c -)
          tar -xzf "$tmp/gadgetcast_linux_arm64.tar.gz" -C "$files"
          echo "$VERSION" >"$files/VERSION"
          ls -l "$files"

      - uses: usimd/pi-gen-action@v1
        id: build
        with:
          image-name: gadgetcast-${{ inputs.version }}
          stage-list: stage0 stage1 stage2 ./image/stage-gadgetcast
          hostname: gadgetcast
          locale: en_US.UTF-8
          keyboard-keymap: us
          keyboard-layout: English (US)
          timezone: Etc/UTC
          compression: xz
          increase-runner-disk-size: true

      - name: Attach image to release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          IMAGE: ${{ steps.build.outputs.image-path }}
        run: |
          sha256sum "$IMAGE" | sed 's#  .*/#  #' >"$IMAGE.sha256"
          gh release upload "$VERSION" "$IMAGE" "$IMAGE.sha256" --clobber
